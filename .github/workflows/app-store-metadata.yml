# Pushes the App Store listing to App Store Connect through Apple's API:
# name, subtitle, description, keywords, screenshots, categories, age
# rating, privacy URL, and the App Review contact + demo account. No
# binary, no submission: pick the build and press Submit in the console.
#
# Secrets (the TestFlight ones, plus one more):
#   ASC_ISSUER_ID, ASC_KEY_CONTENT, ASC_KEY_ID (optional), APPLE_TEAM_ID
#   ASC_CONTACT_PHONE   the App Review contact phone, e.g. +1 228 555 0100.
#                       Without it the review contact/demo account step is
#                       skipped (Apple requires a phone with it).
name: App Store metadata

on:
  workflow_dispatch:
  # New workflows can only be dispatched from the default branch, so this
  # one also runs whenever the listing files change on the release branch.
  push:
    branches: ["claude/prefcard-app-rebuild-47hgvc"]
    paths: ["fastlane/metadata/**", "fastlane/asc_prepare.rb", "fastlane/asc_subscriptions.rb", "fastlane/asc_release.rb", "fastlane/release_request.txt", "fastlane/release_hold.txt", ".github/workflows/app-store-metadata.yml"]

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Write App Store Connect API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/asc"
          if [[ "$ASC_KEY_CONTENT" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s' "$ASC_KEY_CONTENT" > "$HOME/asc/AuthKey.p8"
          else
            echo "$ASC_KEY_CONTENT" | base64 --decode > "$HOME/asc/AuthKey.p8"
          fi

      - name: Release - get the requested version ready
        if: hashFiles('fastlane/release_request.txt') != ''
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID || 'WGG9X24KSU' }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: /home/runner/asc/AuthKey.p8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: ruby fastlane/asc_release.rb prepare

      - name: Verify the draft and fill in App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID || 'WGG9X24KSU' }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: /home/runner/asc/AuthKey.p8
          ASC_CONTACT_PHONE: ${{ secrets.ASC_CONTACT_PHONE }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: ruby fastlane/asc_prepare.rb

      - name: Create the Pro subscriptions and their prices
        if: always()
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID || 'WGG9X24KSU' }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: /home/runner/asc/AuthKey.p8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: ruby fastlane/asc_subscriptions.rb

      - name: Release - submit for App Review
        if: success() && hashFiles('fastlane/release_request.txt') != ''
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID || 'WGG9X24KSU' }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: /home/runner/asc/AuthKey.p8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: ruby fastlane/asc_release.rb submit
