# Creates/fetches the public TestFlight link: ensures the external beta group
# exists with its public link on, attaches the newest processed build, and
# submits it for Apple's one-time beta review. Prints the link in the log.
name: testflight-public-link
on:
  workflow_dispatch:
    inputs:
      contact_phone:
        description: "Beta-review contact phone (E.164, e.g. +12285551234)"
        required: false
        default: ""

jobs:
  public-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install API client deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pyjwt cryptography requests
      - name: Ensure group, build & review; print public link
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || 'WGG9X24KSU' }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          CONTACT_PHONE: ${{ inputs.contact_phone }}
        run: |
          echo "$ASC_KEY_CONTENT" | base64 --decode > AuthKey.p8
          # Canonicalize through OpenSSL (the parser Apple's own tools use);
          # emit safe framing diagnostics if even OpenSSL rejects it.
          if openssl pkey -in AuthKey.p8 -out AuthKey-clean.p8 2>openssl.err; then
            echo "key canonicalized via openssl"
          else
            echo "openssl could not parse the decoded key:"; cat openssl.err
            echo "decoded size: $(wc -c < AuthKey.p8) bytes"
            head -c 28 AuthKey.p8 | cat -v; echo
            tail -c 30 AuthKey.p8 | cat -v; echo
            cp AuthKey.p8 AuthKey-clean.p8
          fi
          ASC_KEY_PATH=AuthKey-clean.p8 .venv/bin/python scripts/testflight_public_link.py
