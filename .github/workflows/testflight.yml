# Builds CoParent for iOS on a GitHub macOS runner and uploads it to TestFlight.
# No local Mac needed: signing is cloud-managed by Xcode using an App Store
# Connect API key (Admin role required for automatic cert/profile creation).
#
# The bundle ID comes from capacitor.config.ts (com.steven.coparent) and must
# match the App Store Connect record ("Co-Parently").
#
# Repository secrets used (already configured in this repo):
#   ASC_ISSUER_ID    App Store Connect API Issuer ID (a UUID)
#   ASC_KEY_CONTENT  The AuthKey_XXXX.p8 — raw text or base64
#   APPLE_TEAM_ID    10-character Apple Developer Team ID
#   ASC_KEY_ID       (optional) API key ID — defaults to the team's known key
#
# Run it from the Actions tab (workflow_dispatch) on the branch to ship.
name: TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      # The native project is not committed — generate it fresh (runs pod
      # install), stamp app icons/splash from the real logo, then sync the
      # web build in. @capacitor/assets isn't a committed dep (its sharp
      # binary can't install everywhere), so pull it here.
      #
      # Icon stamping is checked, not assumed: `cap add ios` lays down
      # Capacitor's placeholder icon, so if the appiconset is byte-identical
      # afterwards then generation silently no-opped and we would ship a
      # stranger's logo to TestFlight. Fail instead — a wrong icon is worse
      # than a missing build, and it is invisible in a green run.
      - name: Generate iOS native project
        run: |
          set -euo pipefail
          npx cap add ios
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          BEFORE=$(find "$ICONSET" -type f -exec md5 -q {} + | sort | md5 -q)
          npm i -D --no-save @capacitor/assets
          npx capacitor-assets generate --ios
          AFTER=$(find "$ICONSET" -type f -exec md5 -q {} + | sort | md5 -q)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::error::App icons are still Capacitor's placeholder — " \
                 "capacitor-assets did not stamp assets/icon-only.png."
            ls -la "$ICONSET"
            exit 1
          fi
          echo "App icons stamped from assets/ ($BEFORE -> $AFTER)"
          npx cap sync ios

      - name: Set export-compliance flag
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

      # Apple requires the iOS 26 SDK (Xcode 26+) for App Store uploads; the
      # runner's default is older, so pick the newest Xcode 26 on the image.
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/asc"
          if [[ "$ASC_KEY_CONTENT" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s' "$ASC_KEY_CONTENT" > "$HOME/asc/AuthKey.p8"
          else
            echo "$ASC_KEY_CONTENT" | base64 --decode > "$HOME/asc/AuthKey.p8"
          fi

      # The archive itself is UNSIGNED — signing happens once at export with
      # the cloud-managed distribution certificate. Signing the archive too
      # minted a new Apple Development certificate on every run (ephemeral
      # runner keychains), which eventually hit Apple's certificate cap.
      - name: Archive (unsigned)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # +100 keeps CI build numbers clear of the Co-Parently builds
          # uploaded earlier from a Mac; run_number only ever increases, so
          # numbers stay unique and monotonic.
          BUILD_NUM=$(( ${{ github.run_number }} + 100 ))
          echo "Using build number $BUILD_NUM"
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CURRENT_PROJECT_VERSION=$BUILD_NUM \
            MARKETING_VERSION=1.0

      - name: Export signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || 'WGG9X24KSU' }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import plistlib, os
          with open("build/ExportOptions.plist", "wb") as f:
              plistlib.dump({
                  "method": "app-store-connect",
                  "signingStyle": "automatic",
                  "teamID": os.environ["APPLE_TEAM_ID"],
              }, f)
          PY
          set +e
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::group::Xcode distribution logs"
            for d in $(find /var/folders -type d -name "*.xcdistributionlogs" 2>/dev/null); do
              for f in "$d"/*.log; do echo "== $f =="; tail -n 150 "$f"; done
            done
            echo "::endgroup::"
            exit $STATUS
          fi
          ls -la build/export

      # Xcode 26.3's combined export+upload fails with an "unnamed format
      # error", so upload separately with fastlane pilot.
      - name: Upload to TestFlight (fastlane pilot)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || 'WGG9X24KSU' }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          key = open(os.path.expanduser("~/asc/AuthKey.p8")).read()
          with open(os.path.expanduser("~/asc/key.json"), "w") as f:
              json.dump({"key_id": os.environ["ASC_KEY_ID"],
                         "issuer_id": os.environ["ASC_ISSUER_ID"],
                         "key": key, "in_house": False}, f)
          PY
          IPA=$(ls build/export/*.ipa | head -1)
          echo "Uploading $IPA"
          fastlane pilot upload \
            --ipa "$IPA" \
            --api_key_path "$HOME/asc/key.json" \
            --skip_waiting_for_build_processing true \
            --skip_submission true
