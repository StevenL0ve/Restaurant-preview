name: Deploy · GitHub Pages

# Publishes the PWA build so ORSync can be used (and installed via "Add to
# Home Screen") on a phone without waiting for TestFlight.
# URL: https://stevenl0ve.github.io/Restaurant-preview/
#      https://orsyncapp.com once its DNS records exist (see below).
#
# Custom domain: the site moves to orsyncapp.com only after its DNS points
# at GitHub (four A records "@" -> 185.199.108-111.153, and a CNAME "www" ->
# stevenl0ve.github.io, at Squarespace). orsync.ourgymapp.com (a CNAME
# "orsync" -> stevenl0ve.github.io) is the fallback if that's set up
# instead. Until one is pointed, every deploy stays on github.io, so the
# site never redirects to a name that doesn't resolve. Once it is, the
# CNAME file goes out with the build and GitHub redirects the old address
# (paths and #links included) to the new one.
#
# Uses the gh-pages-branch flow (not actions/deploy-pages) because the
# github-pages *environment* is protected to the default branch, which
# rejects deployments from this feature branch before the job even starts.

on:
  push:
    branches: ["claude/prefcard-app-rebuild-47hgvc"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install and build
        run: |
          npm ci
          npm run build
          # Pages runs Jekyll by default, which drops files/dirs it dislikes.
          touch dist/.nojekyll

      - name: Custom domain ready?
        id: domain
        run: |
          # Once live, stay live: a DNS hiccup on one deploy mustn't drop the
          # CNAME file and bounce everyone back to github.io.
          live=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/CNAME?ref=gh-pages" | tr -d '[:space:]')
          pointed() {
            cname=$(dig +short CNAME "$1" | sed 's/\.$//' | tr 'A-Z' 'a-z')
            a=$(dig +short A "$1")
            echo "$1: CNAME ${cname:-none}, A $(echo $a)" >&2
            [ "$cname" = "stevenl0ve.github.io" ] || echo "$a" | grep -Eq '^185\.199\.1(08|09|10|11)\.153$'
          }
          # Preferred first.
          for DOMAIN in orsyncapp.com orsync.ourgymapp.com; do
            if [ "$live" = "$DOMAIN" ] || pointed "$DOMAIN"; then
              echo "cname=$DOMAIN" >> "$GITHUB_OUTPUT"
              echo "Publishing on https://$DOMAIN"
              exit 0
            fi
          done
          echo "::notice::No custom domain points at GitHub yet, so the site stays on stevenl0ve.github.io."

      - name: Publish dist to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: ${{ steps.domain.outputs.cname }}

      - name: Ensure Pages is enabled and serving gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          create=$(curl -s -o /tmp/create.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "create pages: HTTP $create"
          if [ "$create" != "201" ]; then
            update=$(curl -s -o /tmp/update.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}')
            echo "update pages source: HTTP $update"
          fi
          CNAME="${{ steps.domain.outputs.cname }}"
          if [ -n "$CNAME" ]; then
            # HTTPS is refused until GitHub has issued the certificate (a few
            # minutes to an hour after the first deploy); the next deploy retries.
            https=$(curl -s -o /tmp/https.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d "{\"cname\":\"$CNAME\",\"https_enforced\":true}")
            echo "enforce https: HTTP $https"; cat /tmp/https.json; echo
            echo "Site: https://$CNAME/"
          else
            echo "Site (may take a minute on first deploy):"
            echo "https://stevenl0ve.github.io/Restaurant-preview/"
          fi
