# Builds the Android app on a GitHub Linux runner, signs it with the Play
# upload keystore, and publishes it to the Google Play internal-testing track.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    The upload keystore file, base64-encoded.
#                              Create one anywhere with:
#                              keytool -genkeypair -v -keystore upload.keystore \
#                                -alias upload -keyalg RSA -keysize 2048 -validity 10000
#   ANDROID_KEYSTORE_PASSWORD  Keystore + key password
#   GOOGLE_PLAY_JSON           (optional) Play Console service-account JSON —
#                              when present the signed bundle is auto-published
#                              to the internal track; without it the .aab is
#                              attached as a workflow artifact to upload by hand
#                              (Google requires the very first upload to be
#                              manual through the Play Console anyway).
#
# Run it from the Actions tab (workflow_dispatch) on the branch to ship.
name: Play Store

on:
  workflow_dispatch:

jobs:
  playstore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      # The native project is not committed — generate it fresh, stamp the
      # launcher icons/splash from the real logo, then sync the web build in.
      - name: Generate Android native project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/upload.keystore"

      - name: Configure release signing + version code
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # Stamp a monotonically-increasing versionCode into the generated project.
          sed -i "s/versionCode 1$/versionCode $VERSION_CODE/" android/app/build.gradle
          # Append a release signing config; Gradle merges repeated android{} blocks.
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias "upload"
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$HOME/upload.keystore"
          cd android
          ./gradlew bundleRelease --no-daemon
          ls -la app/build/outputs/bundle/release/

      - name: Attach bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coparent-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Auto-publish to the internal track once the service account exists and
      # the first bundle has been uploaded manually in the Play Console.
      - name: Publish to Play internal track
        env:
          GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_JSON" ]; then
            echo "GOOGLE_PLAY_JSON secret not set — skipping auto-publish."
            echo "Download the coparent-release-aab artifact from this run and upload it in the Play Console."
            exit 0
          fi
          printf '%s' "$GOOGLE_PLAY_JSON" > "$HOME/play-key.json"
          sudo gem install fastlane --no-document
          fastlane supply \
            --package_name com.steven.coparent \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track internal \
            --json_key "$HOME/play-key.json" \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true
