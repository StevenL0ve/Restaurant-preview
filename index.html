<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#56775f" />
    <meta
      name="description"
      content="CGP — The Common Ground Projects app. Order from the café & kitchen, earn punch-card rewards, sign waivers, and book yoga, Zen Den spa & massage sessions."
    />
    <!-- PWA / installable app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CGP" />

    <!-- Display face for the gooey Common Ground lettering style. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet" />

    <title>CGP — The Common Ground Projects</title>

    <!-- Launch splash: brand green (#56775f, the logo's own background) with
         the white lettering, painted before any JS loads and faded out by
         main.tsx once the app has mounted. -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #56775f;
        display: grid; place-items: center;
        transition: opacity 0.45s ease;
      }
      #splash img { width: min(72vw, 360px); display: block; }
      #splash.done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/brand/logo.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
